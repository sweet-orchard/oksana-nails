<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Oksana Nail Artist</title>
    <meta name="description" content="Send a message to Oksana for appointments and creative projects.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💅</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#161814',
                        'brand-card': '#23271F',
                        'brand-olive': '#59634C',
                        'brand-olive-dark': '#3D4434',
                        'brand-cream': '#F8F6F0',
                        'brand-taupe': '#E2DED4',
                        'brand-text': '#23271F',
                        'brand-text-muted': '#575B50',
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Montserrat"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
            background-color: #161814;
        }

        body {
            font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .ref-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.95rem 1.5rem;
            border: 1px solid #2D3227;
            background-color: #23271F;
            color: #F8F6F0;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            text-align: center;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .ref-button:hover {
            background-color: #59634C;
            border-color: #59634C;
            transform: translateY(-1px);
        }

        .input-luxury {
            width: 100%;
            background-color: #FFFFFF;
            border: 1px solid #D8D2C5;
            padding: 0.85rem 1rem;
            font-size: 0.875rem;
            color: #23271F;
            outline: none;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .input-luxury:focus {
            border-color: #59634C;
            box-shadow: 0 0 0 2px rgba(89, 99, 76, 0.15);
        }

        .input-label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #575B50;
            margin-bottom: 0.4rem;
        }

        /* ============================================================ */
        /* CLEAN MINIMALIST ANIMATED CHECKMARK                          */
        /* ============================================================ */
        
        .clean-circle {
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            animation: drawCleanCircle 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .clean-check {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCleanCheck 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.6s forwards;
        }

        .tick-glow {
            animation: softPulse 3s ease-in-out infinite;
        }

        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes drawCleanCircle {
            0% { stroke-dashoffset: 283; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes drawCleanCheck {
            0% { stroke-dashoffset: 60; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes softPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-[#161814] text-[#23271F] flex justify-center min-h-screen selection:bg-[#59634C]/20 selection:text-[#23271F] py-0 sm:py-8 px-0 sm:px-4">

    <div class="w-full max-w-[480px] bg-[#F8F6F0] min-h-screen sm:min-h-0 sm:rounded-2xl shadow-2xl flex flex-col relative border-0 sm:border border-[#2D3227]/20 overflow-hidden pb-6 sm:pb-10">

        <!-- Top Navigation Bar (Logo instead of text) -->
        <header class="sticky top-0 z-30 bg-[#F8F6F0]/90 backdrop-blur-md px-5 py-4 border-b border-[#E2DED4] flex items-center justify-between">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-[#575B50] hover:text-[#23271F] transition-colors py-1">
                <i class="fa-solid fa-arrow-left text-[11px]"></i>
                <span>Back</span>
            </a>
            
            <!-- Logo in Header -->
            <a href="index.html" class="flex items-center">
                <img src="images/logo-dark.png" alt="Oksana" class="h-5 sm:h-5.5 w-auto object-contain opacity-85 hover:opacity-100 transition-opacity" />
            </a>
        </header>

        <!-- Main Content Area (Anchored to top on mobile) -->
        <main class="px-5 sm:px-8 pt-5 sm:pt-8 pb-8 flex-1 flex flex-col justify-start">

            <!-- Active Form Section -->
            <div id="form-container">
                <!-- Title Header -->
                <div class="mb-4 sm:mb-6">
                    <h1 class="font-serif text-2xl sm:text-3xl text-[#23271F] tracking-wide">Work with Me</h1>
                    <p class="text-xs text-[#575B50] font-light mt-1">
                        Send a message for appointments or creative projects.
                    </p>
                </div>

                <!-- Form Box -->
                <div class="bg-white border border-[#E2DED4] p-5 sm:p-6 shadow-sm">
                    
                    <!-- Error Alert -->
                    <div id="error-banner" class="hidden mb-4 p-3.5 bg-red-50/80 border border-red-200 text-red-800 text-xs font-light">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                            <span id="error-message">Oops! There was a problem submitting your form. Please try again.</span>
                        </div>
                    </div>

                    <!-- Contact Form -->
                    <form id="contact-form" action="https://formsubmit.co/9964b82ba784d9abbd034af13d6d30a2" method="POST" class="space-y-4">
                        
                        <!-- FormSubmit Configuration Settings -->
                        <input type="hidden" name="_subject" value="New Enquiry — OXINAILS Portfolio">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        <!-- Honeypot anti-spam field -->
                        <input type="text" name="_honey" style="display:none">
                        
                        <!-- Name -->
                        <div>
                            <label for="client-name" class="input-label">Name</label>
                            <input type="text" id="client-name" name="name" required placeholder="Your name"
                                class="input-luxury" />
                        </div>

                        <!-- Email -->
                        <div>
                            <label for="client-email" class="input-label">Email</label>
                            <input type="email" id="client-email" name="email" required placeholder="Your email address"
                                class="input-luxury" />
                        </div>

                        <!-- Message -->
                        <div>
                            <label for="client-message" class="input-label">Message</label>
                            <textarea id="client-message" name="message" rows="5" required
                                placeholder="Your message or enquiry..."
                                class="input-luxury resize-none"></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-2">
                            <button type="submit" id="submit-btn" class="ref-button">
                                <span id="btn-text">Send Message</span>
                                <i id="btn-icon" class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                            </button>
                        </div>
                    </form>

                </div>
            </div>

            <!-- ========================================================= -->
            <!-- BESPOKE MINIMALIST CONFIRMATION VIEW                       -->
            <!-- ========================================================= -->
            <div id="success-screen" class="hidden py-8 px-4 text-center my-auto">
                
                <!-- Clean Minimalist Animated Checkmark (No leaves) -->
                <div class="flex justify-center mb-6">
                    <div class="relative w-20 h-20 rounded-full bg-[#59634C]/10 flex items-center justify-center tick-glow p-2">
                        <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Clean Outer Ring -->
                            <circle class="clean-circle" cx="50" cy="50" r="42" stroke="#59634C" stroke-width="2.5" stroke-linecap="round" />
                            
                            <!-- Clean Minimal Checkmark -->
                            <path class="clean-check" d="M33 51 L 44 62 L 67 38" stroke="#23271F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Minimalist Content -->
                <div class="fade-in-up space-y-3">
                    <p class="text-[9px] font-bold uppercase tracking-[0.3em] text-[#59634C]">Enquiry Sent</p>
                    
                    <h2 class="font-serif italic text-3xl sm:text-4xl text-[#23271F] font-normal tracking-wide">
                        Thank You
                    </h2>

                    <!-- Clean Minimal Hairline Divider -->
                    <div class="w-12 h-px bg-[#D5C8B8] mx-auto my-2"></div>

                    <p class="text-xs text-[#575B50] font-light max-w-xs mx-auto leading-relaxed pt-1">
                        Your message has been sent directly to Oksana.<br />Expect a thoughtful reply shortly.
                    </p>

                    <!-- Square Editorial Button -->
                    <div class="pt-6 max-w-[280px] mx-auto">
                        <a href="index.html" class="ref-button !bg-[#23271F] !text-[#F8F6F0] hover:!bg-[#59634C] hover:!border-[#59634C] rounded-none flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrow-left text-[10px]"></i>
                            <span>Back to Portfolio</span>
                        </a>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- FormSubmit AJAX Submission Script -->
    <script>
        const form = document.getElementById("contact-form");
        const formContainer = document.getElementById("form-container");
        const submitBtn = document.getElementById("submit-btn");
        const btnText = document.getElementById("btn-text");
        const btnIcon = document.getElementById("btn-icon");
        const successScreen = document.getElementById("success-screen");
        const errorBanner = document.getElementById("error-banner");
        const errorMessage = document.getElementById("error-message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            errorBanner.classList.add("hidden");

            // UI loading state
            btnText.innerText = "Sending...";
            btnIcon.className = "fa-solid fa-spinner fa-spin ml-2 text-xs";
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch("https://formsubmit.co/ajax/9964b82ba784d9abbd034af13d6d30a2", {
                    method: "POST",
                    body: formData,
                    headers: {
                        "Accept": "application/json"
                    }
                });

                const data = await response.json();

                if (response.ok && (data.success === "true" || data.success === true || response.status === 200)) {
                    form.reset();
                    // Fade out form and reveal bespoke confirmation
                    formContainer.classList.add("hidden");
                    successScreen.classList.remove("hidden");
                } else {
                    errorMessage.innerText = data.message || "There was a problem submitting your enquiry. Please try again.";
                    errorBanner.classList.remove("hidden");
                    btnText.innerText = "Send Message";
                    btnIcon.className = "fa-solid fa-arrow-right ml-2 text-xs";
                    submitBtn.disabled = false;
                }
            } catch (error) {
                errorMessage.innerText = "Network error. Please check your internet connection and try again.";
                errorBanner.classList.remove("hidden");
                btnText.innerText = "Send Message";
                btnIcon.className = "fa-solid fa-arrow-right ml-2 text-xs";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
